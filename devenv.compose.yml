volumes:
  motrade-cli:
  motrade-server:
  motrade-codeserver:
  motrade-claude:

secrets:
  code_server_password_motrade:
    file: /srv/dev/secrets/motrade.password

services:
  devenv-motrade:
    image: devenv/motrade:latest
    # Local image only: if it were ever missing, compose would otherwise try
    # to pull docker.io/devenv/motrade, a namespace that is not ours.
    pull_policy: never
    container_name: devenv-motrade
    hostname: motrade
    restart: unless-stopped
    init: true
    user: vscode
    working_dir: /workspaces/motrade
    command: ["/usr/local/bin/entrypoint.sh"]
    environment:
      TUNNEL_NAME: "motrade"
      WORKSPACE_DIR: "/workspaces/motrade"
      TZ: "Europe/Madrid"
      # Pins the tunnel CLI's data dir (GitHub token, downloaded servers) to the
      # -cli volume. Without it the CLI migrates to ~/.vscode/cli, which lives
      # in the container layer and is lost on every rebuild.
      VSCODE_CLI_DATA_DIR: "/home/vscode/.vscode-cli"
      # Claude Code keeps its login, conversations and memory in ~/.claude, but
      # its main config file in ~/.claude.json, outside that directory. Pointing
      # CLAUDE_CONFIG_DIR at the -claude volume puts both on it.
      CLAUDE_CONFIG_DIR: "/home/vscode/.claude"
      # Git: identity from config.env (interpolated by `dev`); SSH key shared
      # read-only from the host.
      GIT_NAME: "${GIT_NAME}"
      GIT_EMAIL: "${GIT_EMAIL}"
      GIT_SSH_COMMAND: "ssh -i /run/devbox-git/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=/run/devbox-git/known_hosts"
    volumes:
      - /srv/dev/projects/motrade:/workspaces/motrade
      - /srv/dev/images/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - /srv/dev/secrets/git:/run/devbox-git:ro
      - motrade-cli:/home/vscode/.vscode-cli
      - motrade-server:/home/vscode/.vscode-server
      - motrade-codeserver:/home/vscode/.local/share/code-server
      - motrade-claude:/home/vscode/.claude
    secrets:
      - source: code_server_password_motrade
        target: code_server_password
    cpus: 1.5
    mem_limit: 8g
    stop_grace_period: 30s
    networks: [edge]
