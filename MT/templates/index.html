{% include "header.html" %}



<script>
$(document).ready(function(){
    $("#accountInfo").load("/account");
    $("#box").load("/strategy/list");
    $("#box2").load("/strategyOpen");
    $("#box3").load("/strategyOperations");
});
setInterval(reloadStrategy, 60000);
function reloadStrategy () {
    $("#accountInfo").load("/account");
    $("#box").load("/strategy/list");
    $("#box2").load("/strategyOpen");
    $("#box3").load("/strategyOperations");
}
</script>

<section id="accountInfo" aria-label="Account"></section>

<section class="box">
    <div class="box-header">
        <h1>Strategies</h1>
        <div class="legend">
            <span><i class="l-long"></i>Long</span>
            <span><i class="l-short"></i>Short</span>
            <span><i class="l-cooldown"></i>Cooldown</span>
            <span><i class="l-error"></i>Error</span>
        </div>
    </div>
    <div id="box" class="box-scroll">
        <div class="loading">Loading...</div>
    </div>
</section>

<section class="box">
    <div class="box-header">
        <h1>Open Operations</h1>
    </div>
    <div id="box2" class="box-scroll">
        <div class="loading">Loading...</div>
    </div>
</section>

<section class="box">
    <div class="box-header">
        <h1>Last Closed Operations</h1>
    </div>
    <div id="box3" class="box-scroll">
        <div class="loading">Loading...</div>
    </div>
</section>
