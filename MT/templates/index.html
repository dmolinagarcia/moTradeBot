{% include "header.html" %}



<script>
$(document).ready(function(){
    $("#accountInfo").load("/account");
    $("#box").load("/strategy/list");
    $("#box2").load("/strategyOpen");
    $("#box3").load("/strategyOperations");
});
setInterval(reloadStrategy, 60000);
function reloadStrategy () {
    $("#accountInfo").load("/account");
    $("#box").load("/strategy/list");
    $("#box2").load("/strategyOpen");
    $("#box3").load("/strategyOperations");
}
</script>

<section id="accountInfo" aria-label="Account"></section>

<section class="box config-card" aria-label="Configuration">

<script>
$(document).ready(function(){
    $("#cfgBox").load("/user/config/");
});
</script>

<div id="cfgBox"></div>

<div id="box4" class="actions">
<!--
    <a href="/clear/" class="button">CLEAR</a>
    <a href="/start/" class="button">START</a>
-->
	{% if request.user.is_staff %}
       <a href="/balance/" class="button secondary">BALANCE</a>
       <a href="/process/" class="button">PROCESS</a>
    {% endif %}
</div>

</section>

<section class="box">
    <div class="box-header">
        <h1>Strategies</h1>
        <div class="legend">
            <span><i class="l-long"></i>Long</span>
            <span><i class="l-short"></i>Short</span>
            <span><i class="l-cooldown"></i>Cooldown</span>
            <span><i class="l-error"></i>Error</span>
        </div>
    </div>
    <div id="box" class="box-scroll">
        <div class="loading">Loading...</div>
    </div>
</section>

<section class="box">
    <div class="box-header">
        <h1>Open Operations</h1>
    </div>
    <div id="box2" class="box-scroll">
        <div class="loading">Loading...</div>
    </div>
</section>

<section class="box">
    <div class="box-header">
        <h1>Last Closed Operations</h1>
    </div>
    <div id="box3" class="box-scroll">
        <div class="loading">Loading...</div>
    </div>
</section>

{% include "footer.html" %}
