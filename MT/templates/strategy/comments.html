<form action="" method="post" id="commentsForm">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="form-footer">
    <input type="button" value="Save" onClick="submitCommentsForm()">
  </div>
</form>

<script language="javascript" type="text/javascript">
    function submitCommentsForm() {
       $(this).load("/strategy/comments/{{ strategy_id }}/", $('#commentsForm').serializeArray());
    }
</script>
